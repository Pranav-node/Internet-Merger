name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Standalone Windows Package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller httpx

      - name: Run automated test suite
        run: |
          python test_security.py
          python run_all_tests.py

      - name: Build and package release
        shell: powershell
        run: |
          .\build.ps1

      - name: Verify release artifacts
        shell: powershell
        run: |
          if (-not (Test-Path "InternetMerger-windows.zip")) {
            Write-Error "Release artifact InternetMerger-windows.zip was not generated!"
            exit 1
          }
          if (-not (Test-Path "checksums.txt")) {
            Write-Error "Checksum file checksums.txt was not generated!"
            exit 1
          }
          Get-Content checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            InternetMerger-windows.zip
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
